<section>
<div style="max-width: 1100px; margin: 0 auto; padding: 56px 24px 88px; display: flex; flex-wrap: wrap; gap: 48px 64px; align-items: flex-end;">
<div style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #8a4519;">A CIÊNCIA DO MÉTODO EIXO</span>
<h1 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: clamp(45px, 6.22vw, 87px); line-height: 1.04; letter-spacing: -0.035em;">Bronca não é <em style="font-style: normal; color: #b4622d;">técnica.</em></h1>
<p style="margin: 0; font-size: 21px; line-height: 33px; color: #2c3b35; max-width: 620px;">Mudar comportamento é uma das áreas mais estudadas da ciência da saúde. A Eixo não inventou a roda: organizou o que a pesquisa já sabe e colocou dentro de um app, de uma equipe e de um consultório.</p>
<p style="margin: 0; font-size: 17px; line-height: 28px; color: #4c5a54; max-width: 620px;">Esta página é para quem quer entender o que está por trás de cada meta, cada check-in e cada conversa com a equipe.</p>
</div>
<nav aria-label="Nesta página" style="flex: 1 1 320px; display: flex; flex-direction: column; border-bottom: 1px solid #cfc6b6;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #8a4519; padding-bottom: 10px;">NESTA PÁGINA</span>
<a href="#com-b" style="display: flex; gap: 14px; align-items: baseline; min-height: 44px; padding: 10px 0; border-top: 1px solid #cfc6b6; color: #142420; text-decoration: none;"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">01</span><span style="font-size: 17px;">O ponto de partida: COM-B</span></a><a href="#taxonomia" style="display: flex; gap: 14px; align-items: baseline; min-height: 44px; padding: 10px 0; border-top: 1px solid #cfc6b6; color: #142420; text-decoration: none;"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">02</span><span style="font-size: 17px;">A taxonomia de 93 técnicas</span></a><a href="#processos" style="display: flex; gap: 14px; align-items: baseline; min-height: 44px; padding: 10px 0; border-top: 1px solid #cfc6b6; color: #142420; text-decoration: none;"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">03</span><span style="font-size: 17px;">Processos, não protocolos</span></a><a href="#noventa" style="display: flex; gap: 14px; align-items: baseline; min-height: 44px; padding: 10px 0; border-top: 1px solid #cfc6b6; color: #142420; text-decoration: none;"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">04</span><span style="font-size: 17px;">Por que ciclos de 90 dias</span></a><a href="#pesadas" style="display: flex; gap: 14px; align-items: baseline; min-height: 44px; padding: 10px 0; border-top: 1px solid #cfc6b6; color: #142420; text-decoration: none;"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">05</span><span style="font-size: 17px;">As técnicas que fazem o trabalho pesado</span></a><a href="#conversa" style="display: flex; gap: 14px; align-items: baseline; min-height: 44px; padding: 10px 0; border-top: 1px solid #cfc6b6; color: #142420; text-decoration: none;"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">06</span><span style="font-size: 17px;">Conversa, não sermão</span></a><a href="#recaida" style="display: flex; gap: 14px; align-items: baseline; min-height: 44px; padding: 10px 0; border-top: 1px solid #cfc6b6; color: #142420; text-decoration: none;"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">07</span><span style="font-size: 17px;">Recaída e manutenção</span></a><a href="#evidencia" style="display: flex; gap: 14px; align-items: baseline; min-height: 44px; padding: 10px 0; border-top: 1px solid #cfc6b6; color: #142420; text-decoration: none;"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">08</span><span style="font-size: 17px;">O que a evidência já mostra</span></a><a href="#ferramentas" style="display: flex; gap: 14px; align-items: baseline; min-height: 44px; padding: 10px 0; border-top: 1px solid #cfc6b6; color: #142420; text-decoration: none;"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">09</span><span style="font-size: 17px;">A caixa de ferramentas Eixo</span></a><a href="#medida" style="display: flex; gap: 14px; align-items: baseline; min-height: 44px; padding: 10px 0; border-top: 1px solid #cfc6b6; color: #142420; text-decoration: none;"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">10</span><span style="font-size: 17px;">Como sabemos se está funcionando</span></a><a href="#referencias" style="display: flex; gap: 14px; align-items: baseline; min-height: 44px; padding: 10px 0; border-top: 1px solid #cfc6b6; color: #142420; text-decoration: none;"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">11</span><span style="font-size: 17px;">Referências</span></a>

<section id="com-b" style="scroll-margin-top: 24px;">
<div style="max-width: 1100px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 36px;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #8a4519;"><span style="font-family: 'Geist Mono', ui-monospace, monospace;">01</span> · O PONTO DE PARTIDA</span>
<h2 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: clamp(27px, 3.53vw, 45px); line-height: 1.06; letter-spacing: -0.035em;">Primeiro, entender por que não acontece.</h2>
</div>
<p style="margin: 0; font-size: 18px; line-height: 30px; color: #2c3b35; max-width: 760px;">Antes de escolher qualquer técnica, a pergunta é: por que esse comportamento não acontece? O modelo COM-B, de Susan Michie e colegas, organiza a resposta em três condições. Um comportamento só acontece quando a pessoa tem <strong>capacidade</strong>, <strong>oportunidade</strong> e <strong>motivação</strong> para ele.</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch;">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 12px; background: #ffffff; border: 1px solid #cfc6b6;">
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 31px;">Capacidade</span>
<span style="font-size: 14px; line-height: 20px; color: #8a4519; font-weight: 600;">C · física e psicológica</span>
<span style="color: #4c5a54; font-size: 15px; line-height: 23px;">Saber como fazer e ter condição de fazer. Sono fragmentado, dor, falta de técnica de treino, não saber montar um prato.</span>
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 12px; background: #ffffff; border: 1px solid #cfc6b6;">
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 31px;">Oportunidade</span>
<span style="font-size: 14px; line-height: 20px; color: #8a4519; font-weight: 600;">O · física e social</span>
<span style="color: #4c5a54; font-size: 15px; line-height: 23px;">O ambiente permite? Agenda, viagens, a geladeira de casa, o happy hour da firma, quem está em volta.</span>
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 12px; background: #ffffff; border: 1px solid #cfc6b6;">
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 31px;">Motivação</span>
<span style="font-size: 14px; line-height: 20px; color: #8a4519; font-weight: 600;">M · reflexiva e automática</span>
<span style="color: #4c5a54; font-size: 15px; line-height: 23px;">O que você decide e o que você faz no piloto automático: hábitos, impulsos, emoções, identidade.</span>
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 12px; background: #1f4d43; color: #f3efe7;">
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 31px;">Comportamento</span>
<span style="font-size: 14px; line-height: 20px; color: #e9a676; font-weight: 600;">B, de behaviour</span>
<span style="color: #d5e2dc; font-size: 15px; line-height: 23px;">Dormir 7h30, treinar três vezes, beber só no fim de semana. E o comportamento, por sua vez, muda capacidade, oportunidade e motivação.</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 24px 28px; border-radius: 12px; background: #e8e2d6;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #8a4519;">NA PRÁTICA</span>
<p style="margin: 0; font-size: 17px; line-height: 28px;">Rafael não dorme 7h30. A bronca de sempre ("precisa dormir mais") supõe que falta motivação. Na avaliação da Eixo, o diagnóstico foi outro: ele <em>quer</em> dormir, mas o celular fica na cabeceira (oportunidade física) e o álcool do jantar fragmenta o sono (capacidade física). A técnica escolhida ataca o que trava de verdade, e não o que parece óbvio.</p>
</div>
</div>
</section>
<section id="taxonomia" style="scroll-margin-top: 24px; background: #142420; color: #efeae0;">
<div style="max-width: 1100px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 36px;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #e9a676;"><span style="font-family: 'Geist Mono', ui-monospace, monospace;">02</span> · A TAXONOMIA</span>
<h2 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: clamp(27px, 3.53vw, 45px); line-height: 1.06; letter-spacing: -0.035em;">93 técnicas, 16 famílias, uma linguagem comum.</h2>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px 48px;">
<p style="flex: 1 1 420px; margin: 0; font-size: 18px; line-height: 30px; color: #d5e2dc;">Em 2013, um grupo liderado por Susan Michie, da University College London, publicou a <em>Behaviour Change Technique Taxonomy</em> (BCTTv1): 93 técnicas de mudança de comportamento, cada uma com nome, definição e código, agrupadas em 16 famílias. O trabalho envolveu dezenas de especialistas de vários países para chegar a um vocabulário que qualquer pesquisador ou clínico pode usar do mesmo jeito.</p>
<p style="flex: 1 1 360px; margin: 0; font-size: 18px; line-height: 30px; color: #d5e2dc;">Por que isso importa para você: quando a Eixo diz que usa "definição de metas" ou "automonitoramento", não é força de expressão. É uma técnica com definição publicada, que dá para aplicar, medir e comparar. Abaixo, as famílias e as técnicas que o método Eixo usa em cada uma.</p>
</div>
<div style="display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;">
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 49px; line-height: 52px; color: #e9a676;">{{usedCount}}</span>
<span style="color: #a9b3ad; max-width: 520px;">técnicas da taxonomia aplicadas de forma explícita no método Eixo, distribuídas em {{usedFamilies}} das 16 famílias.</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 8px;">
<sc-for list="{{fams}}" as="f" hint-placeholder-count="16">
<button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; line-height: 16px; opacity: 0.8;">{{f.num}}</span>
<span style="font-size: 15px; line-height: 20px; font-weight: 500;">{{f.name}}</span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; line-height: 16px; opacity: 0.8;">{{f.count}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 28px; border-radius: 14px; background: #18261f; border: 1px solid #2e3e37;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #e9a676;">FAMÍLIA {{fam.num}}</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 30px; line-height: 37px; letter-spacing: -0.035em;">{{fam.name}}</span>
<span style="color: #a9b3ad; max-width: 760px;">{{fam.about}}</span>
</div>
<div style="display: flex; flex-direction: column;">
<sc-for list="{{techs}}" as="t" hint-placeholder-count="3">
<div style="display: flex; flex-wrap: wrap; gap: 6px 24px; padding: 16px 0; border-top: 1px solid #2e3e37;">
<span style="flex: 0 0 56px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 15px; line-height: 24px; color: #e9a676;">{{t.code}}</span>
<span style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 600;">{{t.name}}</span><span style="font-size: 14px; line-height: 21px; color: #a9b3ad;">{{t.def}}</span></span>
<span style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #7fb3a0; font-size: 11px;">NA EIXO</span><span style="font-size: 15px; line-height: 23px; color: #efeae0;">{{t.eixo}}</span></span>
</div>
</sc-for>
<sc-if value="{{noTechs}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 16px 0; border-top: 1px solid #2e3e37; color: #a9b3ad;">{{fam.none}}</p>
</sc-if>
</div>
</div>
<span style="font-size: 14px; line-height: 21px; color: #a9b3ad;">Nomes das técnicas traduzidos livremente do inglês. Códigos conforme a BCTTv1 (Michie et al., 2013).</span>
</div>
</section>
<section id="processos" style="scroll-margin-top: 24px;">
<div style="max-width: 1100px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 36px;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #8a4519;"><span style="font-family: 'Geist Mono', ui-monospace, monospace;">03</span> · PROCESSOS</span>
<h2 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: clamp(27px, 3.53vw, 45px); line-height: 1.06; letter-spacing: -0.035em;">Processos, não protocolos.</h2>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px 48px;">
<p style="flex: 1 1 440px; margin: 0; font-size: 18px; line-height: 30px; color: #2c3b35;">A medicina tradicional pensa em protocolos: para tal diagnóstico, tal conduta. Funciona para infecção. Funciona mal para hábito. A abordagem baseada em processos, proposta por Stefan Hofmann e Steven Hayes, muda a pergunta: em vez de "qual protocolo serve para esse diagnóstico?", pergunta "quais processos mantêm <em>esta pessoa</em> presa, e quais técnicas mexem nesses processos?".</p>
<p style="flex: 1 1 360px; margin: 0; font-size: 17px; line-height: 28px; color: #4c5a54;">É por isso que dois homens com a mesma testosterona e o mesmo peso saem da avaliação com planos diferentes. Um trava na impulsividade da noite. O outro, na agenda que não fecha. O exame é igual; o processo, não.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 12px; border: 1px solid #cfc6b6; background: #ffffff;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #7d8a84;">PROTOCOLO</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 23px; line-height: 29px;">"Homem, 42 anos, sobrepeso: dieta e exercício."</span>
<span style="color: #4c5a54;">A mesma receita para todo mundo. Quem não segue "não tem disciplina".</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 12px; background: #1f4d43; color: #f3efe7;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #e9a676;">PROCESSO</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 23px; line-height: 29px;">"Come por estresse depois das 21h, dorme mal, treina só quando dá."</span>
<span style="color: #d5e2dc;">Alvos: gatilho noturno, regulação do estresse, rotina de sono. Técnicas escolhidas para esses alvos, revisadas a cada semana.</span>
</div>
</div>
</div>
</section>
<section id="noventa" style="scroll-margin-top: 24px; background: #e8e2d6;">
<div style="max-width: 1100px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 36px;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #8a4519;"><span style="font-family: 'Geist Mono', ui-monospace, monospace;">04</span> · O TEMPO DO HÁBITO</span>
<h2 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: clamp(27px, 3.53vw, 45px); line-height: 1.06; letter-spacing: -0.035em;">Por que ciclos de 90 dias.</h2>
</div>
<p style="margin: 0; font-size: 18px; line-height: 30px; color: #2c3b35; max-width: 780px;">Num estudo da University College London, Phillippa Lally e colegas acompanharam pessoas criando um hábito novo e mediram quando ele ficava automático. A mediana foi de <strong>66 dias</strong>, com variação enorme: de 18 a 254 dias, conforme a pessoa e o hábito. Perder um dia isolado não atrapalhou o processo.</p>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 28px; border-radius: 14px; background: #ffffff; border: 1px solid #cfc6b6;">
<span style="font-weight: 600;">Dias até o hábito ficar automático</span>
<div aria-hidden="true" style="position: relative; height: 92px; margin: 8px 0 0;">
<div style="position: absolute; left: 0; right: 0; top: 44px; height: 2px; background: #cfc6b6;"></div>
<div style="position: absolute; left: 6.7%; width: 87.8%; top: 38px; height: 14px; border-radius: 999px; background: #d5e2dc;"></div>
<div style="position: absolute; left: 24.4%; top: 22px; width: 3px; height: 46px; background: #1f4d43;"></div>
<span style="position: absolute; left: 24.4%; top: 0; transform: translateX(-50%); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #1f4d43;">66 · mediana</span>
<div style="position: absolute; left: 33.3%; top: 22px; width: 3px; height: 46px; background: #b4622d;"></div>
<span style="position: absolute; left: 33.3%; top: 72px; transform: translateX(-50%); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #b4622d; white-space: nowrap;">90 · ciclo Eixo</span>
<span style="position: absolute; left: 6.7%; top: 72px; transform: translateX(-50%); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #4c5a54;">18</span>
<span style="position: absolute; left: 94.1%; top: 72px; transform: translateX(-50%); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #4c5a54;">254</span>
</div>
<span style="font-size: 14px; line-height: 21px; color: #4c5a54;">Escala de 0 a 270 dias. Faixa verde: variação observada no estudo (Lally et al., 2010).</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 24px;">
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 2px solid #142420;"><span style="font-size: 19px; line-height: 26px; font-weight: 600;">Cabe um hábito</span><span style="color: #4c5a54;">Noventa dias cobrem o tempo típico para uma mudança deixar de depender de esforço.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 2px solid #142420;"><span style="font-size: 19px; line-height: 26px; font-weight: 600;">Cabe uma rodada de exames</span><span style="color: #4c5a54;">É um intervalo clínico razoável para repetir exames e ver efeito no corpo, não só no comportamento.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 2px solid #142420;"><span style="font-size: 19px; line-height: 26px; font-weight: 600;">Cabe na cabeça</span><span style="color: #4c5a54;">Começo, meio e fim visíveis. Três prioridades por vez. Quem chega ao dia 90 decide o próximo ciclo com dados.</span></div>
</div>
</div>

<section id="pesadas" style="scroll-margin-top: 24px;">
<div style="max-width: 1100px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 36px;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #8a4519;"><span style="font-family: 'Geist Mono', ui-monospace, monospace;">05</span> · O TRABALHO PESADO</span>
<h2 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: clamp(27px, 3.53vw, 45px); line-height: 1.06; letter-spacing: -0.035em;">Três técnicas que fazem a maior parte do trabalho.</h2>
</div>
<p style="margin: 0; font-size: 18px; line-height: 30px; color: #2c3b35; max-width: 760px;">Das técnicas que usamos, três carregam a maior parte do resultado e têm evidência robusta por trás.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px;"><div style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 12px; background: #ffffff; border: 1px solid #cfc6b6;">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">BCT 2.3 · 2.4</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 31px; letter-spacing: -0.035em;">Automonitoramento</span>
<span style="color: #2c3b35; font-size: 16px; line-height: 26px;">Registrar o próprio comportamento é uma das técnicas com evidência mais consistente. Uma meta-análise de intervenções de alimentação e atividade física (Michie et al., 2009) encontrou efeito maior quando o automonitoramento vinha junto de outra técnica de autorregulação, como meta ou revisão de meta.</span>
<span style="padding-top: 12px; border-top: 1px solid #e8e2d6; color: #1f4d43; font-size: 15px; line-height: 24px;"><strong>Na Eixo:</strong> Check-in de dois minutos, relógio conectado, e o plano do ciclo que transforma o registro em meta e revisão.</span>
</div><div style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 12px; background: #ffffff; border: 1px solid #cfc6b6;">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">BCT 1.4</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 31px; letter-spacing: -0.035em;">Intenções de implementação</span>
<span style="color: #2c3b35; font-size: 16px; line-height: 26px;">Planos no formato "quando X acontecer, eu faço Y". Uma meta-análise de 94 estudos (Gollwitzer e Sheeran, 2006) encontrou efeito de tamanho médio a grande sobre o alcance de metas.</span>
<span style="padding-top: 12px; border-top: 1px solid #e8e2d6; color: #1f4d43; font-size: 15px; line-height: 24px;"><strong>Na Eixo:</strong> Cada prioridade vira um "se-então": "quando chegar do trabalho, o celular carrega na sala"; "no churrasco de sábado, água entre uma cerveja e outra".</span>
</div><div style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 12px; background: #ffffff; border: 1px solid #cfc6b6;">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #8a4519;">BCT 8.7</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 31px; letter-spacing: -0.035em;">Tarefas graduadas</span>
<span style="color: #2c3b35; font-size: 16px; line-height: 26px;">Dividir o comportamento difícil em passos fáceis e aumentar a dificuldade aos poucos, conforme o sucesso.</span>
<span style="padding-top: 12px; border-top: 1px solid #e8e2d6; color: #1f4d43; font-size: 15px; line-height: 24px;"><strong>Na Eixo:</strong> O health coach sobe ou desce a meta toda semana. Do sofá aos 10 km, do cigarro diário à fase 1 de redução.</span>
</div></div>
</div>
</section>
<section id="conversa" style="scroll-margin-top: 24px; background: #e8e2d6;">
<div style="max-width: 1100px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 36px;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #8a4519;"><span style="font-family: 'Geist Mono', ui-monospace, monospace;">06</span> · ENTREVISTA MOTIVACIONAL</span>
<h2 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: clamp(27px, 3.53vw, 45px); line-height: 1.06; letter-spacing: -0.035em;">Conversa, não sermão.</h2>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px 48px;">
<p style="flex: 1 1 440px; margin: 0; font-size: 18px; line-height: 30px; color: #2c3b35;">A entrevista motivacional, criada por William Miller e Stephen Rollnick, parte de uma ideia simples: quem está em dúvida sobre mudar resiste quando alguém insiste. Em vez de convencer, o profissional ajuda a pessoa a ouvir os próprios motivos, com perguntas abertas, escuta reflexiva e respeito à autonomia.</p>
<p style="flex: 1 1 360px; margin: 0; font-size: 17px; line-height: 28px; color: #4c5a54;">Uma revisão de 72 ensaios clínicos (Rubak et al., 2005) encontrou efeito em 74% deles, com redução de IMC, pressão arterial e consumo de álcool, superando o conselho tradicional. É a base de toda conversa da equipe Eixo, e o motivo de começarmos pelo eixo em que você está mais pronto, não pelo mais grave.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 12px; border: 1px solid #cfc6b6; background: #ffffff;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #7d8a84;">SERMÃO</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 21px; line-height: 28px;">"Você precisa parar de beber durante a semana."</span>
<span style="color: #4c5a54;">A pessoa concorda na consulta e defende o hábito em casa.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 12px; background: #1f4d43; color: #f3efe7;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #e9a676;">CONVERSA</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 21px; line-height: 28px;">"Você contou que dorme pior depois do vinho. O que seria um primeiro passo possível?"</span>
<span style="color: #d5e2dc;">A decisão sai da boca dele. É por isso que tende a durar.</span>
</div>
</div>
</div>
</section>
<section id="recaida" style="scroll-margin-top: 24px;">
<div style="max-width: 1100px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 36px;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #8a4519;"><span style="font-family: 'Geist Mono', ui-monospace, monospace;">07</span> · RECAÍDA E MANUTENÇÃO</span>
<h2 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: clamp(27px, 3.53vw, 45px); line-height: 1.06; letter-spacing: -0.035em;">O escorregão faz parte. Desistir, não.</h2>
</div>
<p style="margin: 0; font-size: 18px; line-height: 30px; color: #2c3b35; max-width: 780px;">O modelo de prevenção de recaída de Alan Marlatt separa duas coisas: o <strong>lapso</strong>, um escorregão pontual, e a <strong>recaída</strong>, a volta ao padrão antigo. O que transforma um no outro costuma ser a leitura do escorregão: "estraguei tudo, então tanto faz". Marlatt chamou isso de efeito de violação da abstinência. O estudo de Lally, citado acima, mostra o outro lado: perder um dia isolado não atrapalhou a formação do hábito.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 24px;">
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 2px solid #142420;"><span style="font-size: 19px; line-height: 26px; font-weight: 600;">Mapear as situações de risco</span><span style="color: #4c5a54;">Antes do ciclo, você e a equipe listam onde costuma tropeçar: viagem, churrasco, fim de trimestre, briga em casa.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 2px solid #142420;"><span style="font-size: 19px; line-height: 26px; font-weight: 600;">Ter o plano B pronto</span><span style="color: #4c5a54;">Para cada situação, um plano curto escrito por você. Menos improviso, menos culpa.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 2px solid #142420;"><span style="font-size: 19px; line-height: 26px; font-weight: 600;">Voltar em até 48 horas</span><span style="color: #4c5a54;">O app detecta a queda e a equipe chama. O lapso é tratado como dado, e o plano encolhe para caber na fase difícil.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 2px solid #142420;"><span style="font-size: 19px; line-height: 26px; font-weight: 600;">Manutenção depois do ciclo 3</span><span style="color: #4c5a54;">Check-ins mais leves, equipe a cada quinze dias, exames a cada seis meses. O hábito já anda sozinho; o app fica de vigia.</span></div>
</div>
</div>
</section>
<section id="evidencia" style="scroll-margin-top: 24px; background: #142420; color: #efeae0;">
<div style="max-width: 1100px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 32px;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #e9a676;"><span style="font-family: 'Geist Mono', ui-monospace, monospace;">08</span> · A EVIDÊNCIA</span>
<h2 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: clamp(27px, 3.53vw, 45px); line-height: 1.06; letter-spacing: -0.035em;">O que a ciência do estilo de vida já mostrou.</h2>
</div>
<p style="margin: 0; font-size: 18px; line-height: 30px; color: #d5e2dc; max-width: 780px;">A medicina do estilo de vida existe como área organizada desde 2004, quando médicos americanos fundaram o American College of Lifestyle Medicine. Hoje há certificação própria e milhares de médicos certificados em mais de 90 países. Os pilares são os mesmos em todo lugar: alimentação, movimento, sono, estresse, conexões sociais e substâncias de risco. A Eixo soma o hormônio e a energia do homem.</p>
<div style="display: flex; flex-direction: column; border-bottom: 1px solid #2e3e37;"><div style="display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 22px 0; border-top: 1px solid #2e3e37;"><span style="flex: 0 0 200px; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 21px; line-height: 28px; color: #e9a676;">Prevenção</span><span style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 4px;"><span style="color: #efeae0;">Programa de Prevenção do Diabetes (EUA, 3.234 adultos com pré-diabetes): mudança de estilo de vida reduziu em 58% os casos novos de diabetes, contra 31% da metformina.</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #a9b3ad;">Knowler et al., NEJM, 2002</span></span></div><div style="display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 22px 0; border-top: 1px solid #2e3e37;"><span style="flex: 0 0 200px; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 21px; line-height: 28px; color: #e9a676;">Remissão</span><span style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 4px;"><span style="color: #efeae0;">Estudo DiRECT (Reino Unido): 46% das pessoas com diabetes tipo 2 entraram em remissão em 12 meses com um programa estruturado de perda de peso na atenção primária.</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #a9b3ad;">Lean et al., Lancet, 2018</span></span></div><div style="display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 22px 0; border-top: 1px solid #2e3e37;"><span style="flex: 0 0 200px; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 21px; line-height: 28px; color: #e9a676;">Sono e hormônio</span><span style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 4px;"><span style="color: #efeae0;">Uma semana dormindo 5 horas por noite reduziu a testosterona de homens jovens e saudáveis em 10% a 15%, o equivalente a 10 a 15 anos de envelhecimento.</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #a9b3ad;">Leproult e Van Cauter, JAMA, 2011</span></span></div><div style="display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 22px 0; border-top: 1px solid #2e3e37;"><span style="flex: 0 0 200px; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 21px; line-height: 28px; color: #e9a676;">Peso e hormônio</span><span style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 4px;"><span style="color: #efeae0;">Em homens com obesidade, perder peso aumenta a testosterona, e o ganho é maior quanto maior a perda de peso. Vale para dieta e para cirurgia.</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #a9b3ad;">Corona et al., Eur J Endocrinol, 2013</span></span></div><div style="display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 22px 0; border-top: 1px solid #2e3e37;"><span style="flex: 0 0 200px; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 21px; line-height: 28px; color: #e9a676;">Cérebro</span><span style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 4px;"><span style="color: #efeae0;">Quase metade dos casos de demência está ligada a 14 fatores modificáveis, entre eles pressão alta, inatividade, álcool em excesso, colesterol e isolamento social.</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #a9b3ad;">Lancet Commission, 2024</span></span></div><div style="display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 22px 0; border-top: 1px solid #2e3e37;"><span style="flex: 0 0 200px; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 21px; line-height: 28px; color: #e9a676;">O homem brasileiro</span><span style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 4px;"><span style="color: #efeae0;">Homens vivem 6,6 anos menos que as mulheres no Brasil, e vão menos ao médico: 69% foram no último ano, contra 82% das mulheres.</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #a9b3ad;">IBGE, 2024; PNS, 2019</span></span></div></div>
</div>
</section>
<section id="ferramentas" style="scroll-margin-top: 24px; background: #0f1a17; color: #efeae0;">
<div style="max-width: 1100px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 36px;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #e9a676;"><span style="font-family: 'Geist Mono', ui-monospace, monospace;">09</span> · FERRAMENTAS</span>
<h2 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: clamp(27px, 3.53vw, 45px); line-height: 1.06; letter-spacing: -0.035em;">A caixa de ferramentas Eixo.</h2>
</div>
<p style="margin: 0; font-size: 18px; line-height: 30px; color: #d5e2dc; max-width: 760px;">As técnicas viram ferramentas concretas, usadas pela equipe na consulta e por você no app. Cada uma indica os códigos da taxonomia que aplica.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 12px;"><div style="display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 12px; background: #18261f; border: 1px solid #2e3e37;">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline;"><span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #e9a676; font-size: 11px;">AVALIAÇÃO</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #7fb3a0;">2.4 · 2.7</span></div>
<span style="font-size: 18px; line-height: 24px; font-weight: 600;">Mapa dos oito eixos</span>
<span style="color: #a9b3ad; font-size: 15px; line-height: 23px;">Linha de base de hormonal, energia, sono, alimentação, corpo, mente, conexões e hábitos. Gera o Índice Eixo.</span>
</div><div style="display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 12px; background: #18261f; border: 1px solid #2e3e37;">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline;"><span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #e9a676; font-size: 11px;">AVALIAÇÃO</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #7fb3a0;">base do plano</span></div>
<span style="font-size: 18px; line-height: 24px; font-weight: 600;">Diagnóstico COM-B</span>
<span style="color: #a9b3ad; font-size: 15px; line-height: 23px;">Para cada prioridade, o que falta: capacidade, oportunidade ou motivação.</span>
</div><div style="display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 12px; background: #18261f; border: 1px solid #2e3e37;">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline;"><span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #e9a676; font-size: 11px;">AVALIAÇÃO</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #7fb3a0;">1.2 · 15.1</span></div>
<span style="font-size: 18px; line-height: 24px; font-weight: 600;">Régua de prontidão</span>
<span style="color: #a9b3ad; font-size: 15px; line-height: 23px;">De 0 a 10, quão pronto você está para mudar cada eixo. Começamos pelo mais pronto, não pelo mais grave.</span>
</div><div style="display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 12px; background: #18261f; border: 1px solid #2e3e37;">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline;"><span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #e9a676; font-size: 11px;">PLANEJAMENTO</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #7fb3a0;">1.1 · 1.3</span></div>
<span style="font-size: 18px; line-height: 24px; font-weight: 600;">Plano 3 × 90</span>
<span style="color: #a9b3ad; font-size: 15px; line-height: 23px;">Três prioridades por ciclo, cada uma com meta semanal mensurável.</span>
</div><div style="display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 12px; background: #18261f; border: 1px solid #2e3e37;">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline;"><span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #e9a676; font-size: 11px;">PLANEJAMENTO</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #7fb3a0;">1.4</span></div>
<span style="font-size: 18px; line-height: 24px; font-weight: 600;">Se-então</span>
