<script>
DC.define("AppEixo", (function () {

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = {
screen: (props && props.screen) ? props.screen : 'welcome',
ready: false,
goals: ['energia', 'sono', 'hormonal'],
axis: 2,
metric: 0,
view: (props && props.view) ? props.view : 'sono',
mood: 4,
dispo: 4,
libido: 3,
estresse: 2,
saved: false
};
}
componentDidMount() { this.arm(); }
componentWillUnmount() { clearTimeout(this._t); }
arm() {
clearTimeout(this._t);
this._t = setTimeout(() => this.setState({ ready: true }), 120);
}
go(s, extra) {
this.setState(Object.assign({ screen: s, ready: false }, extra || {}));
this.arm();
}
renderVals() {
const st = this.state;
const ready = st.ready;
const screen = st.screen;

// ---- eixos (radar) ----
const AX = [
{ name: 'Hormonal', score: 72, delta: '+9 em 30 dias', text: 'Testosterona total em 412 ng/dL, subindo nas três últimas coletas. Próxima coleta em 9 dias.' },
{ name: 'Energia', score: 68, delta: '+5 em 30 dias', text: 'Disposição média de 3,6 em 5 nos últimos 14 dias. Libido estável.' },
{ name: 'Sono', score: 81, delta: '+4 em 30 dias', text: '7h13 por noite em média, com horário regular. Meta: 7h30.' },
{ name: 'Alimentação', score: 70, delta: '+6 em 30 dias', text: 'Proteína na meta em 4 de 7 dias. Jantar mais cedo nas noites de semana.' },
{ name: 'Corpo', score: 64, delta: '+2 em 30 dias', text: '31 km corridos nesta semana. Massa magra estável e gordura corporal em queda lenta.' },
{ name: 'Mente', score: 74, delta: '+3 em 30 dias', text: 'Humor estável. O estresse costuma subir às segundas-feiras.' },
{ name: 'Conexões', score: 78, delta: '+2 em 30 dias', text: 'Dois encontros com amigos nesta semana e o desafio em grupo do Clube.' },
{ name: 'Hábitos', score: 85, delta: '+11 em 30 dias', text: '12 dias sem álcool e nenhum cigarro nesta semana. Meta: 30 dias.' }
];
const cx = 170, cy = 150, R = 88;
const pt = (k, s) => {
const a = (-90 + (360 / AX.length) * k) * Math.PI / 180;
return { x: cx + R * s * Math.cos(a), y: cy + R * s * Math.sin(a) };
};
const vals = {};
let sum = 0;
const poly = [];
AX.forEach((a, k) => {
sum += a.score;
const p = pt(k, a.score / 100);
poly.push(p.x.toFixed(1) + ',' + p.y.toFixed(1));
const on = (screen === 'welcome' ? -1 : st.axis) === k;
vals['d' + k + 'x'] = p.x.toFixed(1);
vals['d' + k + 'y'] = p.y.toFixed(1);
vals['d' + k + 'r'] = on ? 6 : 3.5;
vals['d' + k + 'f'] = on ? '#d98a52' : '#7fb3a0';
vals['l' + k] = on ? '#efeae0' : '#a9b3ad';
});
vals.radarPts = poly.join(' ');
vals.index = String(Math.round(sum / AX.length));
vals.radarG = 'transform-origin: 170px 150px; transform: scale(' + (ready ? 1 : 0.15) + '); opacity: ' + (ready ? 1 : 0) + '; transition: transform 900ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 500ms ease;';
vals.axes = AX.map((a, k) => {
const on = st.axis === k;
return {
name: a.name,
score: a.score,
pressed: on ? 'true' : 'false',
pick: () => this.setState({ axis: k }),
style: 'min-height: 56px; border-radius: 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 6px 10px; font-family: inherit; cursor: pointer; text-align: left; color: #efeae0; background: ' + (on ? '#1d3a32' : '#0f1a17') + '; border: ' + (on ? '1.5px solid #7fb3a0' : '1px solid #2e3e37') + ';'
};
});
vals.sel = AX[st.axis];

// ---- objetivos ----
const G = [
{ id: 'energia', label: 'Mais energia e disposição' },
{ id: 'libido', label: 'Libido e vida sexual' },
{ id: 'sono', label: 'Dormir melhor' },
{ id: 'hormonal', label: 'Entender meus hormônios' },
{ id: 'corpo', label: 'Ganhar força e correr mais' },
{ id: 'alimentacao', label: 'Comer melhor sem dieta maluca' },
{ id: 'mente', label: 'Menos estresse, mais foco' },
{ id: 'conexoes', label: 'Mais tempo com amigos e família' },
{ id: 'habitos', label: 'Beber ou fumar menos' },
{ id: 'fertilidade', label: 'Fertilidade e planos de ter filhos' }
];
vals.goals = G.map((g) => {
const on = st.goals.indexOf(g.id) >= 0;
return {
label: g.label,
pressed: on ? 'true' : 'false',
toggle: () => {
const cur = this.state.goals;
const next = cur.indexOf(g.id) >= 0 ? cur.filter((x) => x !== g.id) : cur.concat([g.id]);
this.setState({ goals: next });
},
style: 'display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 15px; color: #efeae0; cursor: pointer; background: ' + (on ? '#1d3a32' : '#18261f') + '; border: ' + (on ? '1.5px solid #7fb3a0' : '1px solid #2e3e37') + ';',
dot: 'flex: 0 0 auto; box-sizing: border-box; width: 12px; height: 12px; border-radius: 999px; border: 1.5px solid ' + (on ? '#7fb3a0' : '#6c7a73') + '; background: ' + (on ? '#7fb3a0' : 'transparent') + ';'
};
});
vals.goalCount = st.goals.length === 1 ? '1 objetivo' : st.goals.length + ' objetivos';

// ---- hormonal ----
const MET = [
{ short: 'T. total', name: 'Testosterona total', unit: 'ng/dL', v: [268, 331, 389, 412], lo: 264, hi: 916, dmin: 240, dmax: 480, dec: 0 },
{ short: 'T. livre', name: 'Testosterona livre', unit: 'ng/dL', v: [5.1, 6.4, 7.2, 7.9], lo: 5, hi: 21, dmin: 4, dmax: 9, dec: 1 },
{ short: 'Estradiol', name: 'Estradiol', unit: 'pg/mL', v: [22, 28, 31, 34], lo: 11, hi: 44, dmin: 15, dmax: 40, dec: 0 }
];
const fmtN = (n, d) => n.toFixed(d).replace('.', ',');
const m = MET[st.metric];
const yOf = (v) => {
const y = 122 - (v - m.dmin) / (m.dmax - m.dmin) * 104;
return Math.max(14, Math.min(122, y));
};
const ys = m.v.map(yOf);
const bandTop = yOf(Math.min(m.hi, m.dmax));
const bandBot = yOf(Math.max(m.lo, m.dmin));
const last = m.v[3], prev = m.v[2];
const pct = Math.round((last - prev) / prev * 100);
vals.cur = {
name: m.name,
value: fmtN(last, m.dec),
unit: m.unit,
delta: (pct >= 0 ? '+' : '') + pct + '% vs coleta anterior',
ref: fmtN(m.lo, m.dec) + ' a ' + fmtN(m.hi, m.dec) + ' ' + m.unit,
bandY: bandTop.toFixed(1),
bandH: (bandBot - bandTop).toFixed(1),
line: [40, 120, 200, 280].map((x, i) => x + ',' + ys[i].toFixed(1)).join(' '),
y0: ys[0].toFixed(1),
y1: ys[1].toFixed(1),
y2: ys[2].toFixed(1),
y3: ys[3].toFixed(1),
lineStyle: 'stroke-dasharray: 100; stroke-dashoffset: ' + (ready ? 0 : 100) + '; transition: stroke-dashoffset 1000ms ease-out;'
};
vals.metrics = MET.map((x, i) => {
const on = st.metric === i;
return {
short: x.short,
pressed: on ? 'true' : 'false',
pick: () => { this.setState({ metric: i, ready: false }); this.arm(); },
style: 'flex: 1 1 0; min-height: 44px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; color: ' + (on ? '#0f1a17' : '#efeae0') + '; background: ' + (on ? '#7fb3a0' : '#18261f') + '; border: 1px solid ' + (on ? '#7fb3a0' : '#2e3e37') + ';'
};
});
const chipOk = 'font-size: 11px; line-height: 16px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: #1d3a32; color: #7fc4a0;';
const chipAlert = 'font-size: 11px; line-height: 16px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: #3a211b; color: #f08f78;';
vals.panel = [
{ name: 'Testosterona total', value: '412 ng/dL', ref: '264 a 916', status: 'Na faixa', chip: chipOk },
{ name: 'Testosterona livre', value: '7,9 ng/dL', ref: '5,0 a 21,0', status: 'Na faixa', chip: chipOk },
{ name: 'SHBG', value: '38 nmol/L', ref: '16 a 55', status: 'Na faixa', chip: chipOk },
{ name: 'Estradiol', value: '34 pg/mL', ref: '11 a 44', status: 'Na faixa', chip: chipOk },
{ name: 'Hematócrito', value: '51,2 %', ref: '40 a 50', status: 'Acima da faixa', chip: chipAlert },
{ name: 'PSA total', value: '0,7 ng/mL', ref: 'até 4,0', status: 'Na faixa', chip: chipOk }
];

// ---- rotina ----
const segOn = 'flex: 1 1 0; min-height: 44px; border-radius: 999px; border: 0; background: #7fb3a0; color: #0f1a17; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;';
const segOff = 'flex: 1 1 0; min-height: 44px; border-radius: 999px; border: 0; background: transparent; color: #efeae0; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer;';
vals.sonoOn = st.view === 'sono' ? 'true' : 'false';
vals.treinoOn = st.view === 'treino' ? 'true' : 'false';
vals.sonoStyle = st.view === 'sono' ? segOn : segOff;
vals.treinoStyle = st.view === 'treino' ? segOn : segOff;
vals.isSono = st.view === 'sono';
vals.isTreino = st.view === 'treino';
vals.isAlim = st.view === 'alim';
vals.alimOn = st.view === 'alim' ? 'true' : 'false';
vals.alimStyle = st.view === 'alim' ? segOn : segOff;
vals.showAlim = () => this.setState({ view: 'alim' });
vals.showSono = () => this.setState({ view: 'sono' });
vals.showTreino = () => this.setState({ view: 'treino' });
const SL = [['Qua', 6.4], ['Qui', 7.0], ['Sex', 7.4], ['Sáb', 6.8], ['Dom', 7.6], ['Seg', 8.1], ['Ter', 7.2]];
vals.targetBottom = (7.5 / 9 * 110).toFixed(1);
vals.sleepBars = SL.map((d, i) => ({
day: d[0],
bar: 'width: 100%; border-radius: 4px 4px 0 0; height: ' + (d[1] / 9 * 110).toFixed(1) + 'px; background: ' + (i === 6 ? '#7fb3a0' : '#2e5a4d') + ';'
}));
const KM = [['S4', 18], ['S5', 24], ['S6', 22], ['S7', 28], ['S8', 26], ['S9', 31]];
vals.kmBars = KM.map((d, i) => ({
week: d[0],
km: d[1],
bar: 'width: 100%; border-radius: 4px 4px 0 0; height: ' + (d[1] / 36 * 96).toFixed(1) + 'px; background: ' + (i === 5 ? '#7fb3a0' : '#2e5a4d') + ';'
}));

// ---- mente ----
const ML = ['Mal', 'Baixo', 'Ok', 'Bem', 'Ótimo'];
vals.moods = ML.map((l, i) => {
const on = st.mood === i + 1;
return {
n: i + 1,
label: l,
pressed: on ? 'true' : 'false',
pick: () => this.setState({ mood: i + 1, saved: false }),
style: 'flex: 1 1 0; min-height: 64px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: inherit; cursor: pointer; color: ' + (on ? '#0f1a17' : '#efeae0') + '; background: ' + (on ? '#7fb3a0' : '#0f1a17') + '; border: 1px solid ' + (on ? '#7fb3a0' : '#2e3e37') + ';'
};
});
const scale = (key) => [1, 2, 3, 4, 5].map((n) => {
const on = st[key] === n;
return {
n: n,
pressed: on ? 'true' : 'false',
pick: () => this.setState({ [key]: n, saved: false }),
style: 'flex: 1 1 0; min-height: 44px; border-radius: 12px; font-family: \'Geist Mono\', ui-monospace, monospace; font-size: 16px; cursor: pointer; color: ' + (on ? '#0f1a17' : '#efeae0') + '; background: ' + (on ? '#7fb3a0' : '#0f1a17') + '; border: 1px solid ' + (on ? '#7fb3a0' : '#2e3e37') + ';'
};
});
vals.scaleA = scale('dispo');
vals.scaleB = scale('libido');
vals.scaleC = scale('estresse');
vals.isSaved = st.saved;
vals.save = () => this.setState({ saved: true });
vals.saveLabel = st.saved ? 'Check-in registrado' : 'Registrar check-in';
vals.saveStyle = 'min-height: 52px; border-radius: 999px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border: ' + (st.saved ? '1px solid #7fb3a0' : '0') + '; background: ' + (st.saved ? 'transparent' : '#7fb3a0') + '; color: ' + (st.saved ? '#7fb3a0' : '#0f1a17') + ';';
const HIST = [3, 3, 4, 2, 3, 4, 4, 3, 5, 4, 4, 3, 4, 4];
vals.moodHist = HIST.map((v, i) => ({
bar: 'flex: 1 1 0; border-radius: 3px; height: ' + (v * 9) + 'px; background: ' + (i === 13 ? '#d98a52' : '#7fb3a0') + '; opacity: ' + (i === 13 ? 1 : (0.35 + v * 0.1).toFixed(2)) + ';'
}));

// ---- navegação ----
vals.isWelcome = screen === 'welcome';
vals.isGoals = screen === 'goals';
vals.isHoje = screen === 'hoje';
vals.isRetomada = screen === 'retomada';
vals.goRetomada = () => this.go('retomada');
vals.isHormonal = screen === 'hormonal';
vals.isRotina = screen === 'rotina';
vals.isMente = screen === 'mente';
vals.isCuidado = screen === 'cuidado';
vals.showTabs = !(screen === 'welcome' || screen === 'goals');
vals.goWelcome = () => this.go('welcome');
vals.goGoals = () => this.go('goals');
vals.goHoje = () => this.go('hoje');
vals.goHormonal = () => this.go('hormonal');
vals.goRotina = () => this.go('rotina');
vals.goMente = () => this.go('mente');
