<section style="max-width: 1280px; margin: 0 auto; padding: 48px 24px 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px 32px;">
<div style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 28px; padding-bottom: 48px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #8a4519;">SAÚDE MASCULINA COM MÉTODO</span>
<h1 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: clamp(47px, 6.22vw, 94px); line-height: 1.04; letter-spacing: -0.035em;">Chega de consulta que <em style="font-style: normal; color: #b4622d;">não muda nada.</em></h1>
<p style="margin: 0; font-size: 21px; line-height: 32px; color: #2c3b35; max-width: 560px;">A Eixo não é mais um médico. É um método: avaliação completa, um plano de 90 dias, um app que anda com você todo dia e uma equipe que ajusta o caminho toda semana. Você e seu médico olhando os mesmos dados.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 4px;">
<a href="#planos" style="display: inline-flex; align-items: center; min-height: 54px; padding: 0 28px; border-radius: 12px; background: #1f4d43; color: #f3efe7; text-decoration: none; font-weight: 500; font-size: 17px;">Começar meu ciclo</a>
<a href="#metodo" style="display: inline-flex; align-items: center; min-height: 54px; padding: 0 28px; border-radius: 12px; border: 1px solid #7d8a84; color: #142420; text-decoration: none; font-size: 17px;">Ver como funciona</a>

<span style="display: flex; flex-direction: column;"><span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 25px; line-height: 31px;">90 dias</span><span style="font-size: 14px; line-height: 20px; color: #4c5a54;">por ciclo, com começo, meio e fim</span></span>
<span style="display: flex; flex-direction: column;"><span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 25px; line-height: 31px;">Toda semana</span><span style="font-size: 14px; line-height: 20px; color: #4c5a54;">a equipe fala com você</span></span>
<span style="display: flex; flex-direction: column;"><span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 25px; line-height: 31px;">Todo mês</span><span style="font-size: 14px; line-height: 20px; color: #4c5a54;">o médico revisa seus dados</span></span>

<!-- ================= O PROBLEMA ================= -->
<section id="problema" style="background: #0f1a17; color: #efeae0;">
<div style="max-width: 1200px; margin: 0 auto; padding: 120px 24px; display: flex; flex-direction: column; gap: 56px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 48px;">
<div style="flex: 1 1 600px; display: flex; flex-direction: column; gap: 16px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; color: #e9a676;">VOCÊ CONHECE ESSE FILME</span>
<h2 style="margin: 0; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: clamp(30px, 4.2vw, 55px); line-height: 1.04; letter-spacing: -0.035em;">Consulta. Exame. Bronca. <em style="font-style: normal; color: #e9a676;">Volta em seis meses.</em></h2>
</div>
<p style="flex: 1 1 300px; max-width: 400px; margin: 0; font-size: 19px; line-height: 30px; color: #a9b3ad;">A maioria dos homens já passou por isso. Muitos desistiram de se cuidar por causa disso.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 12px; background: #18261f; border: 1px solid #2e3e37;">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; line-height: 18px; color: #e9a676;">01</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 25px; line-height: 29px; letter-spacing: -0.035em;">Algo não vai bem.</span>
<span style="color: #a9b3ad;">Cansaço, libido em baixa, sono ruim, a barriga que não vai embora.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 12px; background: #18261f; border: 1px solid #2e3e37;">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; line-height: 18px; color: #e9a676;">02</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 25px; line-height: 29px; letter-spacing: -0.035em;">Quinze minutos de consulta.</span>
<span style="color: #a9b3ad;">"Vamos pedir uns exames."</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 12px; background: #18261f; border: 1px solid #2e3e37;">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; line-height: 18px; color: #e9a676;">03</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 25px; line-height: 29px; letter-spacing: -0.035em;">Retorno com bronca.</span>
<span style="color: #a9b3ad;">"Precisa dormir melhor, beber menos, emagrecer." Sem dizer como.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 12px; background: #18261f; border: 1px solid #2e3e37;">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; line-height: 18px; color: #e9a676;">04</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 25px; line-height: 29px; letter-spacing: -0.035em;">Seis meses sozinho.</span>
<span style="color: #a9b3ad;">Sem plano, sem ninguém perguntando como está indo.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 12px; background: #18261f; border: 1px solid #2e3e37;">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; line-height: 18px; color: #e9a676;">05</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 25px; line-height: 29px; letter-spacing: -0.035em;">Nada mudou.</span>
<span style="color: #a9b3ad;">Os mesmos sintomas. Às vezes, uma receita a mais.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 12px; background: #18261f; border: 1px solid #2e3e37;">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; line-height: 18px; color: #e9a676;">06</span>
<span style="font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: 25px; line-height: 29px; letter-spacing: -0.035em;">Outro médico.</span>
<span style="color: #a9b3ad;">E o filme recomeça do zero.</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 14px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; line-height: 20px; color: #e9a676;">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6"></path><path d="M4 4v4h4"></path></svg>
<span>e começa tudo de novo</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 40px 64px; align-items: flex-end; padding-top: 48px; border-top: 1px solid #2e3e37;">
<p style="flex: 1 1 520px; margin: 0; font-family: 'Sora', system-ui, sans-serif; font-weight: 600; font-size: clamp(27px, 3.36vw, 44px); line-height: 1.1; letter-spacing: -0.035em;">O problema não é você. <span style="color: #e9a676;">É o modelo.</span></p>
<p style="flex: 1 1 340px; max-width: 460px; margin: 0; font-size: 18px; line-height: 29px; color: #d5e2dc;">A consulta tradicional foi feita para tratar o que quebra. Mudar o que você faz todo dia exige outra coisa: acompanhamento, medida e ajuste. Exige método.</p>
</div>

DC.define("AppEixo", (function () {

class Component extends DCLogic {
constructor(props) {

screen: (props && props.screen) ? props.screen : 'welcome',
ready: false,
goals: ['energia', 'sono', 'hormonal'],
axis: 2,
metric: 0,
view: (props && props.view) ? props.view : 'sono',

saved: false
};

this.setState(Object.assign({ screen: s, ready: false }, extra || {}));
this.arm();

];
const cx = 170, cy = 150, R = 88;

const poly = [];
